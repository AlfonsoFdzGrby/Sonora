[package]
name = "sonora"
version = "0.1.0"
description = "Reproductor de música local"
edition = "2021"

[lib]
name = "sonora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
